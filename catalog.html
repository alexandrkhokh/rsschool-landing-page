<!DOCTYPE html>
<html lang="en">
<head>
    <!--@include: src/partials/head.html-->
    <title>Coffee Shop Catalog</title>
</head>
<body class="page-catalog">
<!--@include: src/partials/sprites.html-->
<!--@include: src/partials/header.html-->
<main>
    <div class="container">
        <h1 class="text-center">
            Behind each of our cups hides an <span class="accent">amazing surprise</span>
        </h1>
        <section id="products">
            <div class="products__control">
                <button class="products__category" id="product-category__coffee">
                <span class="product-control__image-wrapper">
                    <img src="/ui/coffee.png" alt="">
                </span>
                    <span class="product-control__text">Coffee</span>
                </button>
                <button class="products__category" id="product-category__tea">
                <span class="product-control__image-wrapper">
                    <img src="/ui/tea.png" alt="">
                </span>
                    <span class="product-control__text">Tea</span>
                </button>
                <button class="products__category" id="product-category__dessert">
                <span class="product-control__image-wrapper">
                    <img src="/ui/dessert.png" alt="">
                </span>
                    <span class="product-control__text">Dessert</span>
                </button>
            </div>

            <div id="product-cards" class="products__cards-wrapper"></div>
        </section>
    </div>
</main>

<div class="modal" id="modal">
    <div class="col d-none d-md-block">
        <img src="" alt="">
    </div>
    <div class="col right">
        <div>
            <h3 class="modal__title"></h3>
            <p></p>
        </div>

        <div class="sizes__wrapper">
            <p>Size</p>
            <div class="sizes"></div>
        </div>
        <div class="additives__wrapper">
            <p>Additives</p>
            <div class="additives"></div>
        </div>
        <div class="price__wrapper">
            <h3>Total</h3>
            <h3 class="price"></h3>
        </div>
        <div class="info">
            <svg width="16" height="16" viewBox="0 0 16 16"><use href="#info"></use></svg>
            <p class="caption">The cost is not final. Download our mobile app to see the final price and place your order. Earn loyalty points and enjoy your favorite coffee with up to 20% discount.</p>
        </div>
        <button class="close button-secondary">Close</button>
    </div>
</div>

<!--@include: src/partials/footer.html-->
<script src="/src/catalog.js" type="module"></script>
</body>
</html>
